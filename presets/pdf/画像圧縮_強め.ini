[Pdf]
QpdfPath=tools/qpdf.exe
OptimizeImages=True
JpegQuality=72
MinWidth=128
MinHeight=128
MinArea=16384
KeepInlineImages=False
ExternalizeInlineImages=True
InlineImageMinBytes=1024
CompressStreams=True
CompressionLevel=9
DecodeLevel=generalized
RecompressFlate=True
StructureCleanup=True
ObjectStreamMode=generate
GenerateObjectStreams=True
RemoveUnreferencedResources=yes
PreserveUnreferencedObjects=False
NormalizeContent=False
CoalesceContents=False
NewlineBeforeEndStream=False
DistributionCompatibility=False
Decrypt=False
RemoveRestrictions=False
RestrictionRemoval=False
MinVersion=
ForceVersion=
Linearize=False
