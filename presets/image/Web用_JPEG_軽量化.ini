[Image]
Enabled=ExifAutoRotate,Resize,FormatConvert,Optimize

[Image.ExifAutoRotate]

[Image.Resize]
TargetWidth=1920
TargetHeight=1080
FitMode=Inside
AllowUpscale=False

[Image.FormatConvert]
