[Image]
Enabled=ExifAutoRotate,Resize,FormatConvert,Optimize

[Image.ExifAutoRotate]

[Image.Resize]
TargetWidth=1600
TargetHeight=1600
FitMode=Inside
AllowUpscale=False

[Image.FormatConvert]
TargetFormat=WebP
Quality=76
CompressionLevel=6

[Image.Optimize]
StripMetadata=True
OptimizeCoding=True
TrellisQuant=False
ReductionEffort=6
Lossless=False
